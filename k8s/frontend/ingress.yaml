apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fun-forecasting-ingress
  namespace: fun-forecasting
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    # Disable buffering for SSE
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - fun-forecasting.example.com
        - api.fun-forecasting.example.com
      secretName: fun-forecasting-tls
  rules:
    - host: fun-forecasting.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: api.fun-forecasting.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
