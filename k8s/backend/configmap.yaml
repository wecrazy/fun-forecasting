apiVersion: v1
kind: ConfigMap
metadata:
  name: fun-forecasting-config
  namespace: fun-forecasting
data:
  APP_ENV: "production"
  DATABASE_URL: "postgresql+asyncpg://postgres:$(POSTGRES_PASSWORD)@postgres:5432/fun_forecasting"
  REDIS_URL: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
  CELERY_BROKER_URL: "redis://:$(REDIS_PASSWORD)@redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://:$(REDIS_PASSWORD)@redis:6379/2"
  DEFAULT_CURRENCY: "usd"
  DEFAULT_ASSET: "funtoken"
  HISTORY_DAYS: "max"
  OPTUNA_TRIALS: "60"
  INCLUDE_BTC_ETH: "true"
  USE_GPU: "auto"
---
apiVersion: v1
kind: Secret
metadata:
  name: fun-forecasting-secrets
  namespace: fun-forecasting
type: Opaque
stringData:
  postgres-password: "change-me-in-production"
  redis-password: "change-me-in-production"
  secret-key: "change-me-in-production"
  coingecko-api-key: ""
  coinmarketcap-api-key: ""
