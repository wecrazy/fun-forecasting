apiVersion: v1
kind: ConfigMap
metadata:
  name: fun-forecasting-config
  namespace: fun-forecasting
data:
  APP_ENV: "production"
  DEFAULT_CURRENCY: "usd"
  DEFAULT_ASSET: "funtoken"
  HISTORY_DAYS: "max"
  OPTUNA_TRIALS: "60"
  INCLUDE_BTC_ETH: "true"
  USE_GPU: "auto"
---
# IMPORTANT: Replace all placeholder values below with actual secure secrets before
# deploying to production. Never commit real credentials to source control.
# Generate a strong SECRET_KEY with: python -c "import secrets; print(secrets.token_hex(32))"
apiVersion: v1
kind: Secret
metadata:
  name: fun-forecasting-secrets
  namespace: fun-forecasting
type: Opaque
stringData:
  postgres-password: "change-me-in-production"
  redis-password: "change-me-in-production"
  database-url: "postgresql+asyncpg://postgres:change-me-in-production@postgres:5432/fun_forecasting"
  redis-url: "redis://:change-me-in-production@redis:6379/0"
  celery-broker-url: "redis://:change-me-in-production@redis:6379/1"
  celery-result-backend: "redis://:change-me-in-production@redis:6379/2"
  secret-key: "change-me-in-production"
  coingecko-api-key: ""
  coinmarketcap-api-key: ""
